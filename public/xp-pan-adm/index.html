<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painel — Nath Monari</title>
    <meta name="description" content="Painel de landing pages e rotas públicas." />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/webp" href="/images/favicon.webp" />
    <link rel="stylesheet" href="/fonts/alexandria.css" />
    <link rel="stylesheet" href="/css/panel.css?v=5" />
  </head>
  <body>
    <div class="panel">
      <div class="panel-bar">
        <div class="panel-bar-marca">Nath Monari</div>
        <div class="panel-bar-conta">
          <span class="panel-user" id="panel-user"></span>
          <button type="button" class="panel-sair" id="panel-logout">Sair</button>
        </div>
      </div>

      <header class="panel-topo">
        <div>
          <h1>Páginas publicadas</h1>
          <p>
            Cada card é uma URL pública. Abra para conferir ou use a engrenagem para mudar
            o endereço. Páginas novas nascem no código.
          </p>
        </div>
        <div class="panel-acoes">
          <button type="button" class="btn btn-prim" id="export-routes">Exportar routes.json</button>
          <button type="button" class="btn btn-sec" id="reload-routes">Recarregar</button>
        </div>
      </header>

      <div class="panel-msg" id="panel-status" role="status"></div>

      <section class="panel-secao panel-secao--primeira" aria-labelledby="sec-paginas">
        <div class="panel-secao-head">
          <h2 id="sec-paginas">Endereços</h2>
          <div class="panel-secao-linha" aria-hidden="true"></div>
          <span class="panel-secao-contagem" id="panel-contagem"></span>
        </div>

        <div class="panel-filtros">
          <input
            type="search"
            id="filtro-busca"
            class="filtro-busca"
            placeholder="Filtrar por URL ou arquivo"
            aria-label="Filtrar cards por URL ou arquivo"
            spellcheck="false"
            autocomplete="off"
          />
          <label class="filtro-ordem" for="filtro-ordem">
            <span>Ordem</span>
            <select id="filtro-ordem">
              <option value="url-asc">URL · A → Z</option>
              <option value="url-desc">URL · Z → A</option>
              <option value="arquivo-asc">Arquivo · A → Z</option>
              <option value="original">Como está no routes.json</option>
            </select>
          </label>
        </div>

        <div class="panel-grid" id="panel-pages"></div>
      </section>

      <footer class="panel-rodape">Painel interno · acesso restrito</footer>
    </div>
    <script src="/js/panel.js?v=6"></script>
  </body>
</html>
